name: screenshots

# Opens the notes in tests/screenshots with smd in kitty on a headless X
# server and compares screenshots of the window with the references in
# tests/screenshots/reference. On a failure the screenshots, references and
# diffs are uploaded as the `screenshots` artifact.
#
# Run it by hand with `update` ticked to get new references instead: the
# artifact then holds this run's screenshots to commit. See CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: Upload the screenshots as new references instead of comparing them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rust-lang/rust
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always

jobs:
  kitty:
    # A fixed image, not ubuntu-latest: the Mesa and X packages it brings
    # draw the window.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release
      - run: sudo tests/screenshots/install.sh
      - run: tests/screenshots/capture.sh target/release/smd "$RUNNER_TEMP/screenshots"
      # Also after a failed capture, so the artifact has diffs for the notes
      # that were saved.
      - if: ${{ !cancelled() && !inputs.update }}
        run: tests/screenshots/compare.sh "$RUNNER_TEMP/screenshots"
      - if: ${{ failure() || inputs.update }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
