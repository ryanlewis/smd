[package]
name = "smd"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
latex-rust = { version = "=2.1.1", default-features = false, features = ["png"] }
libc = "=0.2.191"
png = { version = "=0.17.16", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "=0.2.2"

[dev-dependencies]
font8x8 = "=0.3.1"
