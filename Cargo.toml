[package]
name = "smd"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A sexy markdown reader for the terminal that draws diagrams, maths and headings as images"
authors = ["Ryan Lewis"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryanlewis/smd"
readme = "README.md"
keywords = ["markdown", "terminal", "tui", "mermaid", "obsidian"]
categories = ["command-line-utilities", "text-processing"]
# The demo recordings and screenshots in docs/ stay out of the package.
exclude = ["/docs", "/.github", "/renovate.json", "/.editorconfig", "/.goreleaser.yaml", "/RELEASING.md"]

[dependencies]
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
latex-rust = { version = "=3.0.1", default-features = false, features = ["png"] }
libc = "=0.2.191"
png = { version = "=0.17.16", default-features = false }
pulldown-cmark = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "=0.2.2"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
